defaults:
  - _self_

project:
  name: birds_distillation_edge
  seed: 42
  output_dir: outputs

logging:
  level: INFO
  logger: csv  # options: csv, wandb
  wandb:
    project: birds_distillation_edge
    run_name: null

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 32
  gradient_clip_val: null
  log_every_n_steps: 50
  enable_checkpointing: true

data:
  module: supervised  # options: supervised, distillation, hybrid
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  clip_duration: 3.0
  sample_rate: 32000
  bird_data_dir: data/bird_sound_dataset
  esc50_dir: data/esc50
  allowed_bird_classes: []
  validation_split: 0.15
  test_split: 0.15
  load_pregenerated_no_birds: false
  pregenerated_no_birds_dir: augmented_dataset/no_birds
  esc50_no_bird_ratio: 0.5
  use_augmentation: true
  num_no_bird_samples: 200
  empty_segment_cache_path: cache/empty_segments.json
  refresh_empty_segment_cache: false

model:
  target: birds_distillation_edge.models.core.Improved_Phi_GRU_ATT
  params:
    num_classes: 10
    n_mel_bins: 64
    hidden_dim: 64
    n_fft: 400
    hop_length: 160
    spectrogram_type: mel
    matchbox:
      base_filters: 64

optimizers:
  main:
    name: adamw
    lr: 1e-3
    weight_decay: 0.0
  breakpoint_lr: null
  transition_width_lr: null

scheduler:
  name: null

losses:
  classification:
    name: cross_entropy
  focal:
    enabled: false
    gamma: 2.0
  distillation:
    enabled: false
    alpha: 0.5
    temperature: 4.0

distillation:
  enabled: false
  soft_labels_path: soft_labels_complete
  use_hybrid_dataset: false
  hybrid_ratio: 0.5

benchmark:
  enabled: false
  run_name: default
