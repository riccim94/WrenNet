defaults:
  - base

project:
  name: birds_distillation_edge_distillation

trainer:
  max_epochs: 60

data:
  module: distillation
  batch_size: 16
  load_pregenerated_no_birds: true
  pregenerated_no_birds_dir: soft_labels_complete
  allowed_bird_classes:
    - Bubo_bubo
    - Certhia_familiaris
    - Apus_apus
    - Certhia_brachydactyla
    - Emberiza_cia
    - Lophophanes_cristatus
    - Periparus_ater
    - Poecile_montanus
  num_no_bird_samples: 800
  esc50_no_bird_ratio: 0.5

model:
  params:
    spectrogram_type: combined_log_linear
    num_classes: 9
    matchbox:
      base_filters: 32
      num_layers: 3
      kernel_size: 5
      stride: 1
      dropout: 0.05

optimizers:
  main:
    lr: 5.0e-4
    weight_decay: 1.0e-4
  breakpoint_lr: 1.0e-4
  transition_width_lr: 1.0e-4

losses:
  focal:
    enabled: true
    gamma: 2.0
  distillation:
    enabled: true
    alpha: 0.6
    temperature: 4.0

distillation:
  enabled: true
  soft_labels_path: soft_labels_complete
  use_hybrid_dataset: true
  hybrid_ratio: 0.3
